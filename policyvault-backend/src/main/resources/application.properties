spring.application.name=policyvault-backend

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:policyvault_db}?sslMode=${MYSQL_SSL_MODE:DISABLED}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================

server.port=${PORT:8081}

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET:PolicyVaultSecretKeyForJwtAuthentication2026VerySecureKey2026}

# ===============================
# FRONTEND CORS
# ===============================

app.frontend-url=${FRONTEND_URL:http://localhost:5173,http://localhost:5174}