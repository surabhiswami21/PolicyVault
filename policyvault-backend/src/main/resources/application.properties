spring.application.name=policyvault-backend

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/policyvault_db
spring.datasource.username=root
spring.datasource.password=root

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================

server.port=${PORT:8081}

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET:PolicyVaultSecretKeyForJwtAuthentication2026VerySecureKey2026}

# ===============================
# FRONTEND CORS
# ===============================

app.frontend-url=${FRONTEND_URL:http://localhost:5173,http://localhost:5174}