spring.application.name=policyvault-backend

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVER
# ===============================

server.port=${PORT:8081}

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET:PolicyVaultSecretKeyForJwtAuthentication2026VerySecureKey2026}

# ===============================
# FRONTEND CORS
# ===============================

app.frontend-url=${FRONTEND_URL:http://localhost:5173,http://localhost:5174}