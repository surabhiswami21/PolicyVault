spring.application.name=policyvault-backend

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://YOUR_HOST:YOUR_PORT/YOUR_DATABASE?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================

server.port=${PORT:8081}

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET:your_jwt_secret_here}

# ===============================
# CORS
# ===============================

app.frontend-url=${FRONTEND_URL:http://localhost:5173,http://localhost:5174}